<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Login | Carolina Bandits</title><style>
:root{--green:#143f2c;--silver:#c0c0c0}*{box-sizing:border-box}body{margin:0;background:#090d0b;color:#e3e5e6;font-family:Arial,Helvetica,sans-serif}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--silver);outline-offset:4px}header{min-height:82px;display:flex;align-items:center;justify-content:space-between;padding:12px 5vw;background:#080b09;border-bottom:1px solid #294332}.brand{text-decoration:none;display:flex;gap:12px;align-items:center;font-size:14px;font-weight:900;letter-spacing:1px}.brand-logo{width:54px;height:54px;object-fit:contain}.section{padding:85px 5vw}.login-wrap{max-width:900px;margin:auto}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:3px;font-weight:700}.eyebrow:before{content:"";display:inline-block;width:22px;height:2px;background:currentColor;vertical-align:middle;margin-right:12px}h2{font-size:clamp(36px,5vw,68px);letter-spacing:-2.5px;line-height:1;margin:17px 0 0;text-transform:uppercase}[hidden]{display:none!important}.login-form{max-width:450px;display:grid;gap:18px;margin:32px 0}label{display:grid;gap:9px}input,select,button{font:inherit;padding:14px;border:1px solid #738477;border-radius:3px;background:#111d15;color:#e3e5e6}button{cursor:pointer;background:var(--silver);color:#102018;font-weight:bold}button:disabled{opacity:.6;cursor:wait}.portal-block{padding:25px 0;border-top:1px solid #405446}.status{color:var(--silver);line-height:1.6}.list{padding-left:20px}.list li{padding:10px 0}@media(max-width:760px){header{min-height:70px}.brand{font-size:11px}.section{padding:55px 5vw}}
</style></head><body><header><a class="brand" href="/"><img class="brand-logo" src="/assets/logo.png" alt="" width="54" height="54">CAROLINA BANDITS</a><a href="/">Back to website</a></header><main class="section login-wrap"><div class="eyebrow">Private team portal</div><h2>Bandits family.</h2><p id="status" class="status" role="status" aria-live="polite">Loading sign-in…</p><form id="login" class="login-form" hidden><label>Email / username<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button><button id="reset" type="button">Forgot password?</button><p>Use the email address approved for your team account.</p></form><form id="recovery" class="login-form" hidden><label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Save new password</button></form><section id="dashboard" hidden><button id="logout" type="button">Sign out</button><label style="margin:25px 0">Your division<select id="division"></select></label><section class="portal-block"><h3>Roster</h3><ul class="list" id="roster"></ul></section><section class="portal-block"><h3>Practices</h3><ul class="list" id="practices"></ul></section></section></main><script src="/portal.js" defer></script></body></html>
